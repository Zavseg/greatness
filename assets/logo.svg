<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe67e" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <radialGradient id="dark-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#070a0e" />
    </radialGradient>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#231f20" stroke-width="6" opacity="0.5" />

  <!-- Main Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#dark-bg)" stroke="url(#gold-grad)" stroke-width="4" />
  
  <!-- Inner Gold Border Ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7" />

  <!-- Golden Crown Drawing -->
  <path d="M 60,110 
           L 50,75 
           L 75,90 
           L 100,60 
           L 125,90 
           L 150,75 
           L 140,110 
           Z" 
        fill="url(#gold-grad)" />
  
  <!-- Crown Base Band Details -->
  <path d="M 58,110 A 90,90 0 0 0 142,110" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 64,115 A 90,90 0 0 0 136,115" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" />
  
  <!-- Small Diamonds/Jewels on the base -->
  <circle cx="75" cy="112.5" r="2" fill="#fff" />
  <circle cx="100" cy="112.5" r="2" fill="#fff" />
  <circle cx="125" cy="112.5" r="2" fill="#fff" />
  
  <!-- Circle Jewels on Crown Tips -->
  <circle cx="50" cy="73" r="3.5" fill="url(#gold-grad)" />
  <circle cx="75" cy="88" r="3.5" fill="url(#gold-grad)" />
  <circle cx="100" cy="57" r="4.5" fill="url(#gold-grad)" />
  <circle cx="125" cy="88" r="3.5" fill="url(#gold-grad)" />
  <circle cx="150" cy="73" r="3.5" fill="url(#gold-grad)" />

  <!-- Logo Text: GREATNESS -->
  <text x="100" y="145" 
        font-family="'Outfit', 'Cinzel', 'Georgia', serif" 
        font-size="19" 
        font-weight="900" 
        fill="url(#gold-grad)" 
        text-anchor="middle" 
        letter-spacing="2">GREATNESS</text>

  <!-- Logo Text: FAMILY -->
  <text x="100" y="165" 
        font-family="'Outfit', 'Cinzel', 'Georgia', serif" 
        font-size="13" 
        font-weight="700" 
        fill="url(#gold-grad)" 
        text-anchor="middle" 
        letter-spacing="4" 
        opacity="0.9">FAMILY</text>
</svg>
